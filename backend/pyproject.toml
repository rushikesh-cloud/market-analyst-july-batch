[project]
name = "market-analyst-api"
version = "0.1.0"
description = "FastAPI service for the Market Analyst platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]==0.34.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
