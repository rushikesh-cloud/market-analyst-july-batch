[project]
name = "market-analyst-api"
version = "0.1.0"
description = "FastAPI service for the Market Analyst platform"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-documentintelligence>=1.0,<2",
    "azure-identity>=1.19,<2",
    "azure-keyvault-secrets>=4.9,<5",
    "fastapi==0.115.6",
    "langchain==1.4.2",
    "langchain-openai==1.6.2",
    "openai>=2.45,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "tiktoken>=0.9,<1",
    "uvicorn[standard]==0.34.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "httpx>=0.28.1",
]
